<!DOCTYPE html>
<html>

<head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <style>
    </style>
    <script src="/ticloudagent/q.js"></script>
    <script src="/ticloudagent/agent.js"></script>
    <script type="module">
        import { init } from '/ccs-webview/ccs-plugin-api.js';
        try {
            init('file', 'debug', 'project').then(async (ccs) => {
                const theme = await ccs.ide.getCurrentThemeId();
                const consent = await ccs.ide.getCookieConsent() === 'all';

                const params = Object.fromEntries(new URLSearchParams(location.search));
                const { view, ...rest } = params;
                const server = 'https://dev.ti.com/tirex4-desktop'; // TODO Explore ways to read config without starting up TIREX cloudagent module
                const toTirex = { ...rest, theiaPort: location.port, theme: theme, theiaCookieConsent: consent };
                // const canConnect = false // - For testing offline
                const canConnect = await canConnectToServer(server);

                const urlQuery = `${new URLSearchParams(toTirex).toString()}`;
                // TODO - throw if no view set (and handle in catch)
                if (view && canConnect) {
                    document.location.replace(`${server}/${view}?${urlQuery}`);
                } else if (!canConnect) {
                    document.location.replace(`./index-offline.html?${urlQuery}`);
                } else {
                    alert(`View not specified, received ${JSON.stringify(params)}`);
                }
            });
        } catch (e) {
            // TODO - display exception / message for users if we hit an issue
            const params = Object.fromEntries(new URLSearchParams(location.search));
            const { view, ...rest } = params;
            const toTirex = { ...rest, theiaPort: location.port };
            const urlQuery = new URLSearchParams(toTirex).toString();
            document.location.replace(`./index-offline.html?${urlQuery}`);
        }

        async function canConnectToServer(server) {
            let canConnect = true;
            try {
                await ajaxHead(`${server}/api/serverState`);
            } catch (err) {
                canConnect = false;
                console.error(err);
            }
            return canConnect;
        }

        // helpers taken from ajax.ts

        function ajaxHead(url) {
            return doRequest(url, 'HEAD');
        }

        function doRequest(url, method) {
            const XMLClass = getXMLHttpRequest();
            const req = new XMLClass();
            return new Promise((resolve, reject) => {
                req.onreadystatechange = () => {
                    if (req.readyState === XMLHttpRequest.DONE) {
                        if (req.status !== 200) {
                            return reject(new Error(req.responseText, req.status.toString()));
                        }
                        const contentType = req.getResponseHeader('Content-Type');
                        if (contentType && contentType.includes('application/json')) {
                            resolve(JSON.parse(req.responseText));
                        } else {
                            resolve(req.responseText);
                        }
                    }
                };
                req.open(method, url);
                req.send();
            });
        }

        function getXMLHttpRequest() {
            return XMLHttpRequest;
        }
    </script>
</head>

<body>
</body>

</html>
